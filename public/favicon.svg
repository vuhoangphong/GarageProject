<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Japanese Red -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d91e36" />
      <stop offset="60%" stop-color="#a60c23" />
      <stop offset="100%" stop-color="#690010" />
    </radialGradient>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6d8" />
      <stop offset="25%" stop-color="#f5db8b" />
      <stop offset="55%" stop-color="#d6a537" />
      <stop offset="85%" stop-color="#ab7717" />
      <stop offset="100%" stop-color="#7a5108" />
    </linearGradient>
    <!-- 3D Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Japanese Kanji "京" in 3D Gold Metallic -->
  <text x="64" y="85" 
        text-anchor="middle" 
        font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif" 
        font-weight="900" 
        font-size="68" 
        fill="url(#goldGrad)" 
        stroke="#4a3106" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        paint-order="stroke fill"
        filter="url(#shadow)">京</text>
</svg>