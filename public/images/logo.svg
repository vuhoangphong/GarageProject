<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="100%" height="100%" role="img" aria-label="京都のフォンカー - Phuong Car of Kyoto">
  <defs>
    <!-- Metallic Gold 3D Gradient for Main Japanese Text -->
    <linearGradient id="goldGradientMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5d1" />
      <stop offset="18%" stop-color="#f9e08f" />
      <stop offset="48%" stop-color="#deb243" />
      <stop offset="78%" stop-color="#b98421" />
      <stop offset="100%" stop-color="#84570b" />
    </linearGradient>

    <!-- Metallic Gold Gradient for Subtitle -->
    <linearGradient id="goldGradientSub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c8" />
      <stop offset="35%" stop-color="#ebd185" />
      <stop offset="75%" stop-color="#c9972d" />
      <stop offset="100%" stop-color="#885e0e" />
    </linearGradient>

    <!-- Deep Drop Shadow for 3D Contrast on Any Background -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .svg-main-title {
      font-family: 'Noto Sans JP', 'M PLUS 1p', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 0.04em;
      fill: url(#goldGradientMain);
      stroke: #4c3107;
      stroke-width: 1.6px;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }
    .svg-sub-title {
      font-family: 'Montserrat', 'Arial', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.06em;
      fill: url(#goldGradientSub);
      stroke: #422a05;
      stroke-width: 0.75px;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }
  </style>

  <g filter="url(#logoShadow)">
    <text x="170" y="40" text-anchor="middle" class="svg-main-title">京都のフォンカー</text>
    <text x="170" y="60" text-anchor="middle" class="svg-sub-title">Phuong Car of Kyoto</text>
  </g>
</svg>