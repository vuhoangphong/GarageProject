name: Auto Sync Threads Posts

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Threads Sync Script
        run: node scripts/sync_threads.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json public/news/
          if git diff --staged --quiet; then
            echo "No new updates from Threads. Everything is up to date."
          else
            git commit -m "Auto-sync latest posts from Threads @hfoncar0895 [skip ci]"
            git push origin main
            echo "Successfully synced and pushed new Threads posts!"
          fi